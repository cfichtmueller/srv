name: Quick Build

on:
  workflow_dispatch:  # Allow manual triggering
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  quick-build:
    name: Quick Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.0'
        cache: true
        
    - name: Build library
      run: make build
      
    - name: Run tests
      run: make test
      
    - name: Build examples
      run: make build-examples
